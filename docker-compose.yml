services:
  etcd1:
    image: quay.io/coreos/etcd:v3.6.15
    pull_policy: never
    command: ["/usr/local/bin/etcd", "--name=etcd1", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd1:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd1:2380", "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380", "--initial-cluster-state=new", "--initial-cluster-token=sigilchain-consensus"]
    volumes: [etcd1_data:/etcd-data]
    networks: [sigilchain]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
  etcd2:
    image: quay.io/coreos/etcd:v3.6.15
    pull_policy: never
    command: ["/usr/local/bin/etcd", "--name=etcd2", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd2:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd2:2380", "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380", "--initial-cluster-state=new", "--initial-cluster-token=sigilchain-consensus"]
    volumes: [etcd2_data:/etcd-data]
    networks: [sigilchain]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
  etcd3:
    image: quay.io/coreos/etcd:v3.6.15
    pull_policy: never
    command: ["/usr/local/bin/etcd", "--name=etcd3", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd3:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd3:2380", "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380", "--initial-cluster-state=new", "--initial-cluster-token=sigilchain-consensus"]
    volumes: [etcd3_data:/etcd-data]
    networks: [sigilchain]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  validator1:
    image: sigilchain-app:local
    pull_policy: never
    build: {context: ., target: app}
    command: ["uvicorn", "sigilchain.validator:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: &validator_env
      SIGILCHAIN_IDENTITY_DB: /data/shared/identity_registry.db
      SIGILCHAIN_VALIDATOR_ID: validator1
      SIGILCHAIN_VALIDATOR_KEY_PATH: /data/validator1/validator_signing_key.json
      SIGILCHAIN_API_KEY: ${SIGILCHAIN_API_KEY:-}
      SIGILCHAIN_API_KEY_PREVIOUS: ${SIGILCHAIN_API_KEY_PREVIOUS:-}
      SIGILCHAIN_ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
    volumes: [identity_shared:/data/shared, validator1_keys:/data/validator1]
    networks: [sigilchain]
    depends_on:
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
      etcd3: {condition: service_healthy}
  validator2:
    image: sigilchain-app:local
    pull_policy: never
    build: {context: ., target: app}
    command: ["uvicorn", "sigilchain.validator:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *validator_env
      SIGILCHAIN_VALIDATOR_ID: validator2
      SIGILCHAIN_VALIDATOR_KEY_PATH: /data/validator2/validator_signing_key.json
    volumes: [identity_shared:/data/shared, validator2_keys:/data/validator2]
    networks: [sigilchain]
    depends_on:
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
      etcd3: {condition: service_healthy}
  validator3:
    image: sigilchain-app:local
    pull_policy: never
    build: {context: ., target: app}
    command: ["uvicorn", "sigilchain.validator:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      <<: *validator_env
      SIGILCHAIN_VALIDATOR_ID: validator3
      SIGILCHAIN_VALIDATOR_KEY_PATH: /data/validator3/validator_signing_key.json
    volumes: [identity_shared:/data/shared, validator3_keys:/data/validator3]
    networks: [sigilchain]
    depends_on:
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
      etcd3: {condition: service_healthy}

  console:
    image: sigilchain-app:local
    pull_policy: never
    build: {context: ., target: app}
    command: ["streamlit", "run", "trace_console.py", "--server.address", "0.0.0.0", "--server.headless", "true"]
    environment:
      SIGILCHAIN_NODE_URLS: http://validator1:8001,http://validator2:8002,http://validator3:8003
      SIGILCHAIN_IDENTITY_DB: /data/shared/identity_registry.db
      SIGILCHAIN_VALIDATOR_TRUST_FILE: /data/trust/validator_trust.json
      SIGILCHAIN_WATERMARK_TRANSFORM: ${SIGILCHAIN_WATERMARK_TRANSFORM:-dct}
      SIGILCHAIN_API_KEY: ${SIGILCHAIN_API_KEY:-}
      SIGILCHAIN_API_KEY_PREVIOUS: ${SIGILCHAIN_API_KEY_PREVIOUS:-}
    volumes: [identity_shared:/data/shared, validator_trust:/data/trust]
    networks: [sigilchain]
    depends_on: [validator1, validator2, validator3]

  console-proxy:
    image: sigilchain-app:local
    pull_policy: never
    build: {context: ., target: app}
    profiles: [local-ui]
    command: ["uvicorn", "sigilchain.console_proxy:app", "--host", "0.0.0.0", "--port", "8501"]
    ports: ["127.0.0.1:8501:8501"]
    networks: [sigilchain, console_frontend]
    depends_on: [console]

  cli:
    image: sigilchain-cli:local
    pull_policy: never
    build: {context: ., target: cli}
    profiles: [tools]
    environment:
      SIGILCHAIN_NODE_URLS: http://validator1:8001,http://validator2:8002,http://validator3:8003
      SIGILCHAIN_IDENTITY_DB: /data/shared/identity_registry.db
      SIGILCHAIN_KEYS_DIR: /data/local_keys
      SIGILCHAIN_VALIDATOR_TRUST_FILE: /data/trust/validator_trust.json
      SIGILCHAIN_WATERMARK_TRANSFORM: ${SIGILCHAIN_WATERMARK_TRANSFORM:-dct}
      SIGILCHAIN_API_KEY: ${SIGILCHAIN_API_KEY:-}
      SIGILCHAIN_API_KEY_PREVIOUS: ${SIGILCHAIN_API_KEY_PREVIOUS:-}
      SIGILCHAIN_ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
    volumes: ["./cli-data:/data", identity_shared:/data/shared, validator_trust:/data/trust]
    working_dir: /app
    networks: [sigilchain]
    depends_on: [validator1, validator2, validator3]

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  identity_shared:
  validator1_keys:
  validator2_keys:
  validator3_keys:
  validator_trust:
networks:
  sigilchain:
    internal: true
  console_frontend:
